name: Release

# Tag push (v*) runs the full pipeline: build Fabric + NeoForge -> one GitHub
# Release carrying both jars -> publish both to Modrinth and CurseForge.
# workflow_dispatch allows re-running publishing alone (e.g. after fixing a
# token or a store-side issue) without re-tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Fabric
            branch: Fabric-1.21.1
          - loader: NeoForge
            branch: NeoForge-1.21.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Skija system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR builds read the cache only; pushes refresh it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-includes: |
            caches
            notifications
            .gradle/loom-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify branch version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::${{ matrix.loader }} branch mod_version=${ACTUAL} does not match tag ${EXPECTED}"
            exit 1
          fi
          echo "Branch ${ACTUAL} matches tag ${EXPECTED}"

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Stage mod jar (exclude sources jar)
        run: |
          mkdir -p release-out
          find build/libs -name "*.jar" ! -name "*sources*" -exec cp {} release-out/ \;
          ls -la release-out

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.loader }}
          path: release-out/*.jar
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fabric branch for release notes
        uses: actions/checkout@v4
        with:
          ref: Fabric-1.21.1
          fetch-depth: 0
          fetch-tags: true

      - name: Download all mod jars
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten release jars
        run: |
          mkdir -p release-out
          find artifacts -name "*.jar" ! -name "*sources*" -exec cp {} release-out/ \;
          ls -la release-out

      - name: Extract version from tag
        id: version
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          python3 - <<'PY'
          import os
          version = os.environ["VERSION"]
          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()
          start = changelog.find("## v" + version)
          if start < 0:
              # Hotfix tags (v0.2.2-hotfix) reuse the base version's section.
              start = changelog.find("## v" + version.split("-")[0])
          if start < 0:
              raise SystemExit(f"ERROR: no '## v{version}' section in CHANGELOG.md — write it before tagging")
          end = changelog.find("\n## ", start + 1)
          section = (changelog[start:end] if end > start else changelog[start:]).strip()
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(section + "\n")
          PY

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.jar
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

      # After the release ships, drop an empty "## vX.Y.Z" section into
      # CHANGELOG.md as a commit so the section can be filled in with Chinese
      # prose afterwards. Idempotent: skipped when the section already exists.
      - name: Add changelog skeleton
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          python3 - <<'PY'
          import os, sys
          version = os.environ["VERSION"]
          with open("CHANGELOG.md", encoding="utf-8", newline="") as f:
              text = f.read()
          if f"## v{version}" in text or f"## v{version.split('-')[0]}" in text:
              print("changelog section already exists, skipping")
              sys.exit(0)
          skeleton = (
              f"## v{version}\r\n\r\n### 新增\r\n\r\n- 待回填：\r\n\r\n"
              f"### 修复\r\n\r\n- 待回填：\r\n\r\n"
              f"### 更改\r\n\r\n- 待回填：\r\n\r\n"
          )
          header = text.index("# Changelog")
          insert_at = text.index("\n", header) + 1
          with open("CHANGELOG.md", "w", encoding="utf-8", newline="") as f:
              f.write(text[:insert_at] + "\r\n" + skeleton + text[insert_at:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B Fabric-1.21.1 origin/Fabric-1.21.1
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit --no-verify -m "Add changelog skeleton for ${GITHUB_REF_NAME}"
            git push origin Fabric-1.21.1
          fi

  publish:
    name: Publish (${{ matrix.loader }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Fabric
            branch: Fabric-1.21.1
          - loader: NeoForge
            branch: NeoForge-1.21.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true

      # Skija's Linux native links against EGL/GL system libraries.
      - name: Install Skija system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            .gradle/loom-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and publish to Modrinth and CurseForge
        run: ./gradlew build publishMods --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
