name: Release

# Tag push (v*) runs the full pipeline: build -> GitHub Release -> publish to
# Modrinth and CurseForge. workflow_dispatch allows re-running publishing
# alone (e.g. after fixing a token or a store-side issue) without re-tagging.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, release and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Skija's Linux native links against EGL/GL system libraries.
      - name: Install Skija system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            .gradle/loom-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: version
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Stage mod jar (exclude sources jar)
        run: |
          mkdir -p release-out
          find build/libs -name "*.jar" ! -name "*sources*" -exec cp {} release-out/ \;
          ls -la release-out

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.jar
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

      - name: Publish to Modrinth
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          MOD_VERSION=$(grep -P '^mod_version=' gradle.properties | cut -d= -f2)
          MC_VERSION=$(grep -P '^minecraft_version=' gradle.properties | cut -d= -f2)
          export CF_DISPLAY_NAME="Fabric-${MC_VERSION}-${MOD_VERSION}"
          export CF_MC_VERSION="$MC_VERSION"
          export CF_PROJECT_ID="1681271"
          export CF_FILE="$(find release-out -name '*.jar' | head -n 1)"
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["CURSEFORGE_TOKEN"]
          token = token.strip()
          attempts = [
              ("https://minecraft.curseforge.com/api/game/versions", {"Accept": "application/json"}),
              ("https://minecraft.curseforge.com/api/game/versions", {"Accept": "application/json", "x-api-key": token}),
              ("https://minecraft.curseforge.com/api/game/versions", {"Accept": "application/json", "Authorization": "Bearer " + token}),
              ("https://api.curseforge.com/v1/games/432/versions", {"Accept": "application/json", "x-api-key": token}),
          ]
          data = None
          for url, headers in attempts:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as r:
                      body = json.load(r)
                  data = body["data"]
                  print(f"Version list fetched from {url} (variant {headers})")
                  break
              except Exception as e:
                  print(f"Variant failed: {url} {headers} -> {e}")
          if data is None:
              raise SystemExit("ERROR: could not fetch the CurseForge version list with any auth variant")
          names = {}
          for v in data:
              names.setdefault(v["name"], v["id"])
          print("Sample of available version names:", sorted(names)[:5], "... total", len(names))

          def resolve(name):
              if name in names:
                  return names[name]
              matches = [vid for n, vid in names.items() if n.lower().startswith(name.lower())]
              if not matches:
                  raise SystemExit(f"ERROR: no CurseForge version entry matches '{name}'")
              print(f"Resolved '{name}' via prefix match -> id {matches[0]}")
              return matches[0]

          game_versions = [
              resolve(os.environ["CF_MC_VERSION"]),
              resolve("Fabric"),
              resolve("Java 21"),
          ]
          print("gameVersions ids:", game_versions)

          version = os.environ["CF_DISPLAY_NAME"]
          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()
          start = changelog.find("## v" + version.rsplit("-", 1)[-1])
          if start >= 0:
              end = changelog.find("\n## ", start + 1)
              changelog = (changelog[start:end] if end > start else changelog[start:]).strip()
          metadata = {
              "displayName": version,
              "gameVersions": game_versions,
              "releaseType": "release",
              "changelogType": "markdown",
              "changelog": changelog,
          }
          with open("cf-metadata.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, ensure_ascii=False)
          PY
          curl -sf -X POST "$(printf 'https://minecraft.curseforge.com/api/mods/%s/upload-file' "$CF_PROJECT_ID")" \
            -H "x-api-key: $CURSEFORGE_TOKEN" \
            -H "Accept: application/json" \
            -F "metadata=<cf-metadata.json;type=application/json" \
            -F "file=@$CF_FILE" ; code=$?
          if [ $code -ne 0 ]; then echo "CurseForge upload failed (curl exit $code)"; exit 1; fi
          echo "CurseForge upload accepted"

      # After the release ships, drop an empty "## vX.Y.Z" section into
      # CHANGELOG.md as a commit so the section can be filled in with Chinese
      # prose afterwards. Idempotent: skipped when the section already exists.
      - name: Add changelog skeleton
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          python3 - <<'PY'
          import os, sys
          version = os.environ["VERSION"]
          with open("CHANGELOG.md", encoding="utf-8", newline="") as f:
              text = f.read()
          if f"## v{version}" in text:
              print("changelog section already exists, skipping")
              sys.exit(0)
          skeleton = (
              f"## v{version}\r\n\r\n### 新增\r\n\r\n- 待回填：\r\n\r\n"
              f"### 修复\r\n\r\n- 待回填：\r\n\r\n"
              f"### 更改\r\n\r\n- 待回填：\r\n\r\n"
          )
          header = text.index("# Changelog")
          insert_at = text.index("\n", header) + 1
          with open("CHANGELOG.md", "w", encoding="utf-8", newline="") as f:
              f.write(text[:insert_at] + "\r\n" + skeleton + text[insert_at:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit --no-verify -m "Add changelog skeleton for ${GITHUB_REF_NAME}"
            git push
          fi
