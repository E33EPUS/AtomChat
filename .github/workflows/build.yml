name: Build

on:
  push:
    branches: ["Fabric-1.21.1"]
  pull_request:
    branches: ["Fabric-1.21.1"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR builds read the cache only; pushes refresh it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-includes: |
            caches
            notifications
            .gradle/loom-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: atomchat-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
