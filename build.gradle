plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.8.7'
}

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:11.0.3"

    // Skija (HumbleUI Skia bindings) — same line as the Tuui mod used.
    include(implementation("io.github.humbleui:skija-shared:${project.skija_version}"))
    include(implementation("io.github.humbleui:types:0.1.1"))
    // Windows x64 native. Add linux/mac natives when publishing cross-platform.
    include(implementation("io.github.humbleui:skija-windows-x64:${project.skija_version}"))

    // FlatLaf gives the Swing image picker a modern flat look instead of the
    // dated default Metal one. Bundled so the look and feel works offline.
    include(implementation("com.formdev:flatlaf:${project.flatlaf_version}"))

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // CI test hosts run on Linux; the bundled jar targets Windows only, so the
    // Linux Skija native is test-scoped and never packaged.
    testImplementation "io.github.humbleui:skija-linux-x64:${project.skija_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
        showCauses = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/atomchat.accesswidener")
}

// ---------------------------------------------------------------------------
// Release publishing
//
// Modrinth goes through minotaur; CurseForge is uploaded by the release
// workflow straight through the CurseForge REST API (the CurseForgeGradle
// plugin could not satisfy CurseForge's "environment group" requirement and
// its newer releases need a Java 25 Gradle daemon).
//
// Tokens come from the environment only — never commit them. The publishing
// task is skipped when the token is absent, so everyday builds and tests run
// without any store credentials. The Modrinth project ID lives in
// gradle.properties (modrinth_project_id); the CurseForge project id is
// pinned in the release workflow.
// ---------------------------------------------------------------------------

// Store-facing version label, following the jar naming habit:
// Fabric-<mc_version>-<mod_version>, e.g. Fabric-1.21.1-0.2.2
def storeVersion = "Fabric-${project.minecraft_version}-${project.mod_version}"

def changelogFor(version) {
    def text = rootProject.file('CHANGELOG.md').getText('UTF-8')
    def start = text.indexOf("## v${version}")
    if (start < 0) {
        return "AtomChat ${version}"
    }
    def end = text.indexOf('\n## ', start + 1)
    def section = end > start ? text.substring(start, end) : text.substring(start)
    return section.trim()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = project.modrinth_project_id
    versionNumber = storeVersion
    versionType = "release"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    changelog = changelogFor(project.version)

    dependencies {
        required.project "fabric-api"
    }
}

tasks.named('modrinth') {
    onlyIf { System.getenv("MODRINTH_TOKEN") }
}
