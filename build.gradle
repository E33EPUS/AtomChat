plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Keep the wrapper current for ModDevGradle; this project runs on the same
    // Gradle 9 line as the other NeoForge 1.21.1 workspaces.
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

base {
    archivesName = "${project.mod_id}-NeoForge-${project.minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // No Parchment layer on purpose: AtomChat was written against Yarn and is
    // being ported to the official Mojang names used by NeoForge; adding
    // Parchment would only rename parameters, not classes/methods.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${project.mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.7"

    // Skija (HumbleUI Skia bindings) — same line as the Tuui mod used.
    // NeoForge loads nested jars through JarJar; version ranges are required
    // so a server can pick one copy when multiple mods bundle the same library.
    jarJar(implementation("io.github.humbleui:skija-shared:[${project.skija_version},0.117)"))
    jarJar(implementation("io.github.humbleui:types:[0.1.1,0.2)"))
    // Windows x64 native. Add linux/mac natives when publishing cross-platform.
    jarJar(implementation("io.github.humbleui:skija-windows-x64:[${project.skija_version},0.117)"))

    // FlatLaf gives the Swing image picker a modern flat look instead of the
    // dated default Metal one. Bundled so the look and feel works offline.
    jarJar(implementation("com.formdev:flatlaf:[${project.flatlaf_version},3.8)"))

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    // CI test hosts run on Linux; the bundled jar targets Windows only, so the
    // Linux Skija native is test-scoped and never packaged.
    testImplementation "io.github.humbleui:skija-linux-x64:${project.skija_version}"
}

// This block expands all declared replace properties in the resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
        showCauses = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'No-op placeholder until NeoForge store publishing is configured.'
}
